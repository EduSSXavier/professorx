<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício - Formulário Dinâmico</title>
    <style>
    *{
        margin: 0;  padding: 0;  box-sizing: border-box;
    }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;    padding: 20px;
    }
    .container {
        max-width: 800px;    margin: 0 auto;
    }
    h1 {
        color: white;    text-align: center;     margin-bottom: 30px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .form-container {
        background: white;    padding: 30px;    border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);    margin-bottom: 30px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    label {
        display: block;    margin-bottom: 8px;    color: #333;    font-weight: 600;
    }
    input[type="text"],
    input[type="email"],
    input[type="number"] {
        width: 100%;    padding: 12px;    border: 2px solid #e0e0e0;
        border-radius: 8px;    font-size: 16px;    transition: border-color 0.3s;
    }
    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="number"]:focus {
        outline: none;    border-color: #667eea;
    }
    .checkbox-group {
        display: flex;    flex-wrap: wrap;    gap: 15px;
    }
    .checkbox-item {
        display: flex;    align-items: center;    gap: 8px;
    }
    input[type="checkbox"] {
        width: 18px;    height: 18px;    cursor: pointer;
    }
    .checkbox-item label {
        margin: 0;    cursor: pointer;    font-weight: normal;
    }
    button {
        width: 100%;    padding: 14px;    font-size: 18px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;    border: none;    border-radius: 8px;
        font-weight: 600;   cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        }
    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    button:active {
        transform: translateY(0);
    }
    #resultado {
        background: white;    padding: 30px;    border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);    display: none;
    }
    #resultado.visivel {
        display: block;    animation: slideIn 0.5s ease-out;
    }
    @keyframes slideIn {
        from {    opacity: 0;    transform: translateY(20px);    }
        to {    opacity: 1;   transform: translateY(0);    }
    }
    #resultado h2 {
        color: #667eea;    margin-bottom: 20px;
        border-bottom: 3px solid #667eea;    padding-bottom: 10px;
    }
    #resultado p {
        margin-bottom: 12px;
    }
    .info {
        background: white;    padding: 30px;    border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);    margin-bottom: 30px;
    }
    .info h2 {
        color: #667eea;    margin-bottom: 20px;
        border-bottom: 3px solid #667eea;
        padding-bottom: 10px;
    }
    .info-item {
        margin-bottom: 15px;    padding: 12px;  background: #f8f9fa;
        border-radius: 8px;     border-left: 4px solid #667eea;
    }
    .info-item strong {
        color: #764ba2;     display: inline-block;    min-width: 100px;
    }
    .interesses-lista {
        display: flex;  flex-wrap: wrap;    gap: 8px;    margin-top: 8px;
    }
    .interesse-tag {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);    
        color: white;  padding: 6px 12px;  border-radius: 20px;  font-size: 14px;
    }
    </style>
</head>
<body>
    <div class="container">
        <h1> Formulário de Cadastro</h1>
        <div class="form-container">
            <form id="formCadastro">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" name="idade" min="1" max="120" required>
                </div>
                <div class="form-group">
                    <label>Interesses:</label>
                </div>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="programacao" name="interesses" value="Programação">
                        <label for="programacao">Programação</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="design" name="interesses" value="Design">
                        <label for="design">Design</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="musica" name="interesses" value="Música">
                        <label for="musica">Música</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="esportes" name="interesses" value="Esportes">
                        <label for="esportes">Esportes</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="leitura" name="interesses" value="Leitura">
                        <label for="leitura">Leitura</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="viagens" name="interesses" value="Viagens">
                        <label for="viagens">Viagens</label>
                    </div>
                </div>
                <button type="submit">Cadastrar</button>
            </div>
        </form>
    </div>
    <div id="resultado">
        <h2> Cadastro Realizado com Sucesso!</h2>
        <div id="dadosExibidos"></div>
        </div>
    </div>
    <script>
        // Capturar o formulário
        const form = document.getElementById('formCadastro');
        const resultado = document.getElementById('resultado');
        const dadosExibidos = document.getElementById('dadosExibidos');
        // Adicionar evento de submit
        form.addEventListener('submit', function(event) {
            // Prevenir o comportamento padrão (recarregar a página)
            event.preventDefault();
            // Capturar os valores dos campos
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const idade = document.getElementById('idade').value;
            // Capturar interesses selecionados
            const checkboxes = document.querySelectorAll('input[name="interesses"]:checked');
            const interesses = [];
            checkboxes.forEach(checkbox => {
                interesses.push(checkbox.value);
            } );
            // Montar o HTML com os dados
            let html = `
                <div class="info-item">
                <strong>Nome:</strong> ${nome}
                </div>
                <div class="info-item">
                <strong>E-mail:</strong> ${email}
                </div>
                <div class="info-item">
                <strong>Idade:</strong> ${idade} anos
                </div>
                <div class="info-item">
                <strong>Interesses:</strong>
            `;
            if (interesses.length > 0) {
                html += '<div class="interesses-lista">';
                interesses.forEach(interesse => {
                    html += `<span class="interesse-tag">${interesse}</span>`;
                } );
                html += '</div>';
            } else {
                html += '<p>Nenhum interesse selecionado</p>';
            }
            html += '</div>';
            // Exibir os dados
            dadosExibidos.innerHTML = html;
            resultado.classList.add('visivel');
            // Rolar suavemente até o resultado
            resultado.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            // Limpar o formulário
            form.reset();
            // Log no console
            console.log('Cadastro realizado:', {
                nome,
                email,
                idade,
                interesses
            } );
        } );
    </script>
</body>
</html>
