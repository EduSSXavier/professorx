<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Visistantes</title>
    <link rel="stylesheet" type="text/css" href="visitantes.css">
</head>
<body>
    <div class="bloco">
        Sistema de Controle de Visitantes
    </div>
    <div class="bloco emlinha">
        <div class="caixaentrada">
            Entrada de Visitante
            <br>
            <br>Nome: <input type="text" id="nomeVisita">
            <br>CPF: <input type="text" id="cpfVisita">
            <br>Empresa/sala: <input type="text" id="nomeVisita">
            <br>Motivo: <input type="text" id="nomeVisita">
            <br><br>
            <button id="btEntrada">Cadastrar Entrada</button>
        </div>
        <div class="caixaentrada">
            Saida de Visitante
            <br>
            <br>Id do Visitante: <input type="text" id="idVisita">
            <br><br>
            <button id="btSaida">Cadastrar Saída</button>
        </div>
        <div class="caixaentrada">
            Relatórios
            <br><br>Data: <input type="date" id="dataVisita">
            <br>
            <button id="btRelatData">Visitas por Data</button>
            <br><br>Empresa/sala: <input type="text" id="dataVisita">
            <br>
            <button id="btRelatEmp">Visitas por Empresa/Sala</button>
            <br><br>
            <button id="btRelatEmp">Todas as Visitas</button>
        </div>
    </div>
    <div class="bloco">
    </div>   
</body>
</html>
