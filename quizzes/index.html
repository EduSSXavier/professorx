<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App - Múltiplos Temas</title>
    <!-- Google Fonts + Material Icons + estilos locais -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Saira+Stencil+One&family=Saira:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <!-- Estilos -->
    <link rel="stylesheet" href="quiz.css">
</head>
<body>
    <div class="logo">
        <button class="escola" onclick="window.location.assign('../../index.html')">
            INÍCIO
        </button>
        <img src="../imagens/eu_pixar3d_dir.png" class="icone">
    </div>

    <br><br><br>

    <!-- <main> -->
    <div id="quiz-container">
        <h1>Quiz App</h1>

        <!-- Tela de seleção de tema -->
        <div id="theme-selection">
            <h2>Escolha um tema para o quiz:</h2>
            <div id="themes-list"></div>
        </div>


        <!-- Tela do quiz (mesma de antes) -->
        <div id="quiz" style="display: none;">
            <h2 id="question"></h2>
            <div id="options"></div>
            <br>
            <button id="next-btn" disabled>Próxima</button>
        </div>

        <!-- Tela de resultado -->
        <div id="result" style="display: none;">
            <h2>Resultado</h2>
            <p id="score"></p>
            <br>
            <button id="restart-btn">Escolher outro tema</button>
        </div>

    </div>
    <!-- </main> -->

    <script type="module" src="quiz.js"></script>
</body>
</html>
