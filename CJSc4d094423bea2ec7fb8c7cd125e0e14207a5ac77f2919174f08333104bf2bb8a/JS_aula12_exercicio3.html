<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercício 4 - Validação de Formulário</title>
<style>
*{
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}
.container {
background: white;
padding: 40px;
border-radius: 20px;
box-shadow: 0 15px 50px rgba(0,0,0,0.3);
max-width: 500px;
width: 100%;
}
h1 {
color: #1e3c72;
margin-bottom: 10px;
text-align: center;
}
.subtitle {
text-align: center;
color: #666;
margin-bottom: 30px;
font-size: 14px;
}
.form-group {
margin-bottom: 25px;
position: relative;
}
label {
display: block;
margin-bottom: 8px;
color: #333;
font-weight: 600;
font-size: 14px;
}
input {
width: 100%;
padding: 12px 15px;
border: 2px solid #e0e0e0;
border-radius: 8px;
font-size: 16px;
transition: all 0.3s;
}
input:focus {
outline: none;
border-color: #2a5298;
}
input.valido {
border-color: #27ae60;
background-color: #f0fff4;
}
input.invalido {
border-color: #e74c3c;
background-color: #fff5f5;
}
.mensagem-erro {
display: block;
color: #e74c3c;
font-size: 12px;
margin-top: 5px;
font-weight: 500;
}
.mensagem-sucesso {
display: block;
color: #27ae60;
font-size: 12px;
margin-top: 5px;
font-weight: 500;
}
.icone-validacao {
position: absolute;
right: 15px;
top: 43px;
font-size: 20px;
}
button {
width: 100%;
padding: 15px;
background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
color: white;
border: none;
border-radius: 8px;
font-size: 18px;
font-weight: 600;
cursor: pointer;
transition: all 0.3s;
margin-top: 10px;
}
button:hover:not(:disabled) {
transform: translateY(-2px);
box-shadow: 0 5px 20px rgba(30, 60, 114, 0.4);
}
button:disabled {
background: #95a5a6;
cursor: not-allowed;
}
.requisitos {
background: #f8f9fa;
padding: 15px;
border-radius: 8px;
margin-top: 5px;
font-size: 12px;
}
.requisitos ul {
margin: 8px 0 0 20px;
}
.requisitos li {
margin: 5px 0;
color: #666;
}
.requisitos li.cumprido {
color: #27ae60;
font-weight: 600;
}
.sucesso-final {
display: none;
background: #d4edda;
border: 2px solid #27ae60;
padding: 20px;
border-radius: 8px;
text-align: center;
margin-top: 20px;
}
.sucesso-final.visivel {
display: block;
animation: slideIn 0.5s ease-out;
}
@keyframes slideIn {
from {
opacity: 0;
transform: scale(0.9);
}
to {
opacity: 1;
transform: scale(1);
}
}
.sucesso-final h2 {
color: #27ae60;
margin-bottom: 10px;
}
</style>
</head>
<body>
<div class="container">
<h1> Criar Conta</h1>
🔐
<p class="subtitle">Preencha todos os campos corretamente</p>
<form id="formRegistro">
<div class="form-group">
<label for="nome">Nome Completo:</label>
<input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
<span class="icone-validacao" id="iconeNome"></span>
<span class="mensagem-erro" id="erroNome"></span>
<span class="mensagem-sucesso" id="sucessoNome"></span>
</div>
<div class="form-group">
<label for="email">E-mail:</label>
<input type="email" id="email" name="email" placeholder="seu@email.com">
<span class="icone-validacao" id="iconeEmail"></span>
<span class="mensagem-erro" id="erroEmail"></span>
<span class="mensagem-sucesso" id="sucessoEmail"></span>
</div>
<div class="form-group">
<label for="senha">Senha:</label>
<input type="password" id="senha" name="senha" placeholder="Digite uma senha forte">
<span class="icone-validacao" id="iconeSenha"></span>
<span class="mensagem-erro" id="erroSenha"></span>
<div class="requisitos">
<strong>Requisitos da senha:</strong>
<ul>
<li id="req-tamanho">Mínimo de 8 caracteres</li>
<li id="req-letra">Pelo menos uma letra</li>
<li id="req-numero">Pelo menos um número</li>
</ul>
</div>
</div>
<div class="form-group">
<label for="confirmarSenha">Confirmar Senha:</label>
<input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Digite a senha novame
<span class="icone-validacao" id="iconeConfirmar"></span>
<span class="mensagem-erro" id="erroConfirmar"></span>
<span class="mensagem-sucesso" id="sucessoConfirmar"></span>
</div>
<button type="submit" id="btnSubmit" disabled>Criar Conta</button>
</form>
<div class="sucesso-final" id="sucessoFinal">
<h2> Conta criada com sucesso!</h2>
✅
<p>Bem-vindo(a) à plataforma!</p>
</div>
</div>
<script>
// Elementos do formulário
const form = document.getElementById('formRegistro');
const nome = document.getElementById('nome');
const email = document.getElementById('email');
const senha = document.getElementById('senha');
const confirmarSenha = document.getElementById('confirmarSenha');
if (icone) icone.textContent = '✅' ;
validacao[campo] = true;
atualizarBotao();
// Função para limpar validação
function limparValidacao(campo) {
const input = document.getElementById(campo);
const erro = document.getElementById(`erro${campo.charAt(0).toUpperCase() + campo.slice(1)}`);
const sucesso = document.getElementById(`sucesso${campo.charAt(0).toUpperCase() + campo.slice(1)}`);
const icone = document.getElementById(`icone${campo.charAt(0).toUpperCase() + campo.slice(1)}`);
input.classList.remove('valido', 'invalido');
erro.textContent = '';
if (sucesso) sucesso.textContent = '';
if (icone) icone.textContent = '';
}
// VALIDAÇÃO DO NOME
nome.addEventListener('input', function() {
const valor = this.value.trim();
if (valor === '') {
limparValidacao('nome');
validacao.nome = false;
atualizarBotao();
return;
}
if (valor.length < 3) {
mostrarErro('nome', 'O nome deve ter pelo menos 3 caracteres');
} else if (!/^[a-záàâãéèêíïóôõöúçñ\s]+$/i.test(valor)) {
mostrarErro('nome', 'O nome deve conter apenas letras');
} else {
mostrarSucesso('nome', '✓ Nome válido');
}
} );
// VALIDAÇÃO DO EMAIL
email.addEventListener('input', function() {
const valor = this.value.trim();
if (valor === '') {
limparValidacao('email');
validacao.email = false;
atualizarBotao();
return;
}
const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
if (!regexEmail.test(valor)) {
mostrarErro('email', 'Digite um e-mail válido (ex: usuario@email.com)');
} else {
mostrarSucesso('email', '✓ E-mail válido');
}
} );
// VALIDAÇÃO DA SENHA
senha.addEventListener('input', function() {
const valor = this.value;
// Elementos dos requisitos
const reqTamanho = document.getElementById('req-tamanho');
const reqLetra = document.getElementById('req-letra');
const reqNumero = document.getElementById('req-numero');
if (valor === '') {
limparValidacao('senha');
validacao.senha = false;
reqTamanho.classList.remove('cumprido');
reqLetra.classList.remove('cumprido');
reqNumero.classList.remove('cumprido');
atualizarBotao();
return;
}
// Verificar requisitos
const temTamanho = valor.length >= 8;
const temLetra = /[a-zA-Z]/.test(valor);
const temNumero = /[0-9]/.test(valor);
// Atualizar visual dos requisitos
reqTamanho.classList.toggle('cumprido', temTamanho);
reqLetra.classList.toggle('cumprido', temLetra);
reqNumero.classList.toggle('cumprido', temNumero);
// Validar
if (!temTamanho) {
mostrarErro('senha', 'A senha deve ter pelo menos 8 caracteres');
} else if (!temLetra) {
mostrarErro('senha', 'A senha deve conter pelo menos uma letra');
} else if (!temNumero) {
mostrarErro('senha', 'A senha deve conter pelo menos um número');
} else {
mostrarSucesso('senha');
}
// Revalidar confirmação de senha se já foi preenchida
if (confirmarSenha.value !== '') {
confirmarSenha.dispatchEvent(new Event('input'));
}
} );
// VALIDAÇÃO DA CONFIRMAÇÃO DE SENHA
confirmarSenha.addEventListener('input', function() {
const valor = this.value;
if (valor === '') {
limparValidacao('confirmarSenha');
validacao.confirmarSenha = false;
atualizarBotao();
return;
}
if (valor !== senha.value) {
mostrarErro('confirmarSenha', 'As senhas não coincidem');
} else if (senha.value === '') {
mostrarErro('confirmarSenha', 'Digite a senha primeiro');
} else {
mostrarSucesso('confirmarSenha', '✓ Senhas coincidem');
}
} );
// SUBMIT DO FORMULÁRIO
form.addEventListener('submit', function(event) {
event.preventDefault();
// Verificar se todos os campos são válidos
const todosValidos = Object.values(validacao).every(v => v === true);    
if (!todosValidos) {
alert('Por favor, preencha todos os campos corretamente!');
return;
}
// Exibir mensagem de sucesso
const sucessoFinal = document.getElementById('sucessoFinal');
sucessoFinal.classList.add('visivel');
// Esconder o formulário
form.style.display = 'none';
// Log dos dados (em produção, enviaria para o servidor)
console.log('Formulário enviado com sucesso!', {
nome: nome.value,
email: email.value,
senha: '[PROTEGIDA]'
} );
} );
</script>
</body>
</html>
