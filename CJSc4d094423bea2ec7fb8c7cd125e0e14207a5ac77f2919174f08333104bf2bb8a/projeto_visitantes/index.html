<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Visistantes</title>
    <link rel="stylesheet" type="text/css" href="visitantes.css">
</head>
<body>
    <div class="caixa_externa">
        <h1>Sistema de Controle de Visitantes</h1>
    </div>
    <div class="caixa_externa emlinha">
        <div class="caixa_form">
            <h3>Entrada de Visitante</h3>
            <div class="emlinha">
                <label for="nomeVisita">Nome:</label>
                <input type="text" id="nomeVisita">
            </div>
            <div class="emlinha">
                <label for="cpfVisita">CPF:</label>
                <input type="text" id="cpfVisita">
            </div>
            <div class="emlinha">
                <label for="empresaVisita">Empresa/sala:</label>
                <input type="text" id="empresaVisita">
            </div>
            <div class="emlinha">
                <label for="motivoVisita">Motivo:</label>
                <input type="text" id="motivoVisita">
            </div>
            <button id="btEntrada">Cadastrar Entrada</button>
        </div>
        <div class="caixa_form">
            <h2>Saída de Visitante</h2>
            <div class="emlinha">
                <label for="idVisita">Id Visitante:</label>
                <input type="text" id="idVisita">
            </div>
            <button id="btSaida">Cadastrar Saída</button>
        </div>
        <div class="caixa_form">
            <h2>Relatórios</h2>
            <div class="emlinha">
                <label for="dataVisitaRelat">Por Data:</label>
                <input type="date" id="dataVisitaRelat">
            </div>
            <button id="btRelatData">Emitir Relatório</button>
            <div class="emlinha">
                <label for="empresaVisitaRelat">Empresa/sala:</label>
                <input type="text" id="empresaVisitaRelat">
            </div>
            <button id="btRelatEmp">Emitir Relatório</button>
            <label for="todosVisitaRelat">Todos os Visitantes:</label>
            <button id="btRelatTodas">Emitir Relatório</button>
        </div>
    </div>
    <div class="caixa_externa" id="saidaRelatorio">
        Área de Relatórios
    </div>

    <script src="dados.js"></script>
    <script src="funcoes.js"></script>
</body>
</html>
